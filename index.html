<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LottoForge — Analysis & Generator</title>

    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#080b12">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LottoForge">
</head>

<body>

  <header class="mobile-topbar" aria-label="Nawigacja mobilna">
      <button id="mobileMenuBtn" class="mobile-menu-btn" type="button" aria-label="Otwórz menu" aria-expanded="false" aria-controls="appSidebar">☰</button>
      <div class="mobile-topbar-brand">
          <strong>🎲 LottoForge</strong>
          <small>Mobile</small>
      </div>
      <div class="mobile-topbar-spacer" aria-hidden="true"></div>
  </header>
  <div id="mobileNavBackdrop" class="mobile-nav-backdrop" aria-hidden="true"></div>

  <div class="app">

    <aside id="appSidebar" class="sidebar" aria-label="Menu LottoForge">

        <h2>🎲 LottoForge</h2>

        <div class="mobile-sidebar-head">
            <span>MENU</span>
            <button id="mobileMenuCloseBtn" type="button" aria-label="Zamknij menu">✕</button>
        </div>

       

<button id="miniBtn">Mini Lotto</button>
<button id="lottoBtn">Lotto</button>
<button id="euroBtn">EuroJackpot</button>
<button id="multiBtn">Multi Multi</button>
<button id="extraBtn">Extra Pensja</button>

<hr>

<button>Historia</button>
<button id="statsBtn">Statystyki</button>
<button id="labBtn">🧪 Laboratorium</button>
<button id="rngArenaBtn">⚡ Every Second</button>
<button id="importBtn">📥 Import danych</button>
<button>Ustawienia</button>

    </aside>

    <main class="content">

    <div id="contentArea">

        <h1>Witaj w LottoForge</h1>

        <p>Wybierz moduł z menu po lewej stronie.</p>

    </div>

</main>

</div>
<input
    type="file"
    id="csvFile"
    accept=".csv"
    style="display:none">
<script src="script.js"></script>

</body>
</html>
